# Render Blueprint: https://render.com/docs/blueprint-spec
# Set DATABASE_URL on the web service so the build step can create tables (`db:push-force`).
services:
  - type: web
    name: ebay-price-monitor-api
    branch: main
    runtime: node
    region: oregon
    plan: free
    # Render sets CI=true → pnpm treats install as frozen unless --no-frozen-lockfile. NODE_ENV=production skips devDependencies during install.
    buildCommand: COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack enable && corepack prepare pnpm@9.15.5 --activate && NODE_ENV=development NPM_CONFIG_MINIMUM_RELEASE_AGE=0 pnpm install --no-frozen-lockfile && ( test -z "$DATABASE_URL" || pnpm --filter @workspace/db run push-force ) && pnpm --filter @workspace/ebay-price-checker run build && pnpm --filter @workspace/api-server run build
    # Avoid relying on pnpm being on PATH at runtime (Render runs start separately from build).
    startCommand: cd artifacts/api-server && node --enable-source-maps ./dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
