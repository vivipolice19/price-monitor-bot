name: PostgreSQL Backup

on:
  schedule:
    # Daily at 16:00 UTC (02:00 AEST)
    - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
    steps:
      - name: Validate required secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing secret: RENDER_DATABASE_URL"
            exit 1
          fi

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Dump database
        run: |
          mkdir -p backups
          ts="$(date -u +%Y%m%d-%H%M%S)"
          dump_file="backups/price-monitor-db-${ts}.sql.gz"
          pg_dump "$DATABASE_URL" --no-owner --no-privileges --format=plain | gzip > "$dump_file"
          echo "DUMP_FILE=$dump_file" >> "$GITHUB_ENV"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgres-backup-${{ github.run_id }}
          path: ${{ env.DUMP_FILE }}
          retention-days: 30
